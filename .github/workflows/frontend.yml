name: react CI/CD

# 트리거: Push, Pull Reqeust 이벤트 발생시 작동, 브런치는 main
# 만약 프론트, 백엔드 통합이면 특정 디렉토리가 업데이트 될 때 반영해라 등 세부 조건 추가 가능
on:
  push:
    branches:
      - cicd
  pull_request:
    branches:
      - cicd

# 해야 할 일들
jobs:
  react-deploy:
    runs-on: ubuntu-latest
    steps:
      # 체크아웃 -> github의 저장소로부터 소스를 체크아웃
      - name: Checkout repository resource
        uses: actions/checkout@v2

      # 환경변수 동적 생성 -> .env 파일 생성 (ec2 정보 세팅), 기존 코드 수정(보안)
      - name: .env 환경 변수 동적 생성
        run: |
          echo "${{ secrets.CLIENT_ENV }}" > .env
          pwd
          ls -al 

      # 빌드를 위한 조건 -> nodejs 설치
      # uses: actions/setup-node@v2
      - name: nodejs 설치
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: Install sharp for Linux
        run: npm install --include=optional sharp    

      # npm install 라이브러리 설치 -> node_modules 생성
      # run: npm install
      - name: install 독립 라이브러리
        run: npm install

      # 단위 테스트 -> 생략
      #- name: 단위 테스트
      #  run: npm test

      # 빌드 (테스트)
      # run: npm run build
      - name: 빌드
        run: |
          chmod -R +x ./node_modules/.bin  # npm 실행 파일 디렉토리에 권한 부여
          npm run build                   # 빌드 실행
          chmod -R +r ./.next             # 빌드 결과에 읽기 권한 부여
          ls .                      # 빌드 디렉토리 내용 확인

      # 빌드의 결과물을 ec2 업로드
      # 대상 : 깃허브내부 파일들 전부
      # 타겟 : /home/ubuntu/client
      # 대상 위치에 존재하는 모든 리소스 -> ec2의 ~/client 하위에 복사
      - name: EC2에 빌드된 파일/폴더들 업로드
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: .
          target: /home/ubuntu/client

            
      - name: SSH로 EC2에 접속 후, 기존 프로세스를 종료하고 Next.js 실행 
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script_stop: true
          script: |
            cd /home/ubuntu/client
            npm install
            npm run build
            sudo systemctl restart nginx

            # 기존 Next.js 프로세스 종료 (포트 3000을 사용하는 프로세스 종료)
            pkill -f "npm run start" || true
            sleep 5

            nohup npm run start -- -H 0.0.0.0 -p 3000 > next.log 2>&1 &
            echo "Next.js 서버가 백그라운드에서 실행되었습니다."

                

    

       










