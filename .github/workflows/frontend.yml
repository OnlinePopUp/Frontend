name: react CI/CD

on:
  push:
    branches:
      - cicd
  pull_request:
    branches:
      - cicd

jobs:
  react-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository resource
        uses: actions/checkout@v2

      # .env 파일 생성
      - name: .env 환경 변수 동적 생성
        run: |
          echo "${{ secrets.CLIENT_ENV }}" > .env
          pwd
          ls -al 

      # Node.js 설정
      - name: Node.js 설치
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: Install sharp for Linux
        run: npm install --include=optional sharp    

      # ✅ npm install을 실행하여 node_modules을 캐시하고 EC2에 업로드
      - name: Install dependencies
        run: npm install

      # ✅ Next.js 빌드 실행
      - name: Build Next.js
        run: npm run build

      # ✅ 빌드된 파일 및 node_modules을 EC2로 업로드
      - name: Deploy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: .
          target: /home/ubuntu/client

      # ✅ EC2에서 기존 프로세스를 종료하고 새 버전 실행
      - name: Restart Next.js on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script_stop: true
          script: |
            cd /home/ubuntu/client
            rm -rf .next node_modules  # ✅ 기존 빌드와 의존성 삭제
            npm install                # ✅ 필요한 경우 재설치
            npm run build              # ✅ 새 빌드 실행
            sudo systemctl restart nginx

            # ✅ 기존 Next.js 프로세스 종료 후 새로 실행
            pkill -f "npm run start" || true
            sleep 5
            nohup npm run start -- -H 0.0.0.0 -p 3000 > next.log 2>&1 &
            echo "Next.js 서버가 백그라운드에서 실행되었습니다."
