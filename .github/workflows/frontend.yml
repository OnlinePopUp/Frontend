name: react CI/CD

# 트리거: Push, Pull Reqeust 이벤트 발생시 작동, 브런치는 main
# 만약 프론트, 백엔드 통합이면 특정 디렉토리가 업데이트 될 때 반영해라 등 세부 조건 추가 가능
on:
  push:
    branches:
      - cicd
  pull_request:
    branches:
      - cicd

# 해야 할 일들
jobs:
  react-deploy:
    runs-on: ubuntu-latest
    steps:
      # 체크아웃 -> github의 저장소로부터 소스를 체크아웃
      - name: Checkout repository resource
        uses: actions/checkout@v2

      # 환경변수 동적 생성 -> .env 파일 생성 (ec2 정보 세팅), 기존 코드 수정(보안)
      - name: .env 환경 변수 동적 생성
        run: |
          echo "${{ secrets.CLIENT_ENV }}" > .env
          pwd
          ls -al 

      # 빌드를 위한 조건 -> nodejs 설치
      # uses: actions/setup-node@v2
      - name: nodejs 설치
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: Install sharp for Linux
        run: npm install --include=optional sharp    

      # npm install 라이브러리 설치 -> node_modules 생성
      # run: npm install
      - name: install 독립 라이브러리
        run: npm install

      # 단위 테스트 -> 생략
      #- name: 단위 테스트
      #  run: npm test

      # 빌드 
      # run: npm run build
      - name: 빌드
        run: |
          chmod -R +x ./node_modules/.bin  # npm 실행 파일 디렉토리에 권한 부여
          npm run build                   # 빌드 실행
          chmod -R +r ./.next             # 빌드 결과에 읽기 권한 부여
          ls ./.next                      # 빌드 디렉토리 내용 확인

      - name: 파일 목록 확인
        run: |
          ls -al ./.next
          ls -al package.json || echo "package.json 파일 없음"
          ls -al package-lock.json || echo "package-lock.json 파일 없음"
          ls -al next.config.js || echo "next.config.js 파일 없음"
          ls -al public || echo "public 폴더 없음"
          ls -al .env || echo ".env 파일 없음"
        
      

      # # 빌드의 결과물을 ec2 업로드
      # # 대상 : ./.next/*
      # # 타겟 : /home/ubuntu/client
      # # 대상 위치에 존재하는 모든 리소스 -> ec2의 ~/client 하위에 복사
      # - name: EC2에 빌드된 파일/폴더들 업로드
      #   uses: appleboy/scp-action@v0.1.7
      #   with:
      #     host: ${{ secrets.EC2_HOST }}
      #     username: ${{ secrets.EC2_USER }}
      #     key: ${{ secrets.EC2_KEY }}
      #     source: ./.next/*
      #     target: /home/ubuntu/client

      # EC2로 애플리케이션 파일 업로드
      # 여기서는 동적 서버 실행에 필요한 파일(.next, package.json, next.config.js, public 폴더, .env 등)을 업로드합니다.
      - name: EC2에 애플리케이션 파일 업로드
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: ./.next/*
          target: /home/ubuntu/client

      # # /var/www/html/* <- 기존에 서비스 하던 내용을 모두 삭제(rm) 처리
      # # 뒷정리 (업로드 결과 -> nginx의 root로 이동(설정), 디렉토리 정리
      # - name: SSH로 EC2에 접속후, html등 내용 교체 후 웹서버 재가동
      #   uses: appleboy/ssh-action@v1.2.0
      #   with:
      #     host: ${{ secrets.EC2_HOST }}
      #     username: ${{ secrets.EC2_USER }}
      #     key: ${{ secrets.EC2_KEY }}
      #     script_stop: true
      #     script: |
      #       sudo rm -rf /var/www/html/*
      #       sudo mv /home/ubuntu/client/.next/* /var/www/html
      #       sudo systemctl restart nginx
      #       sudo rm -rf /home/ubuntu/client
            
      # EC2에 접속하여 애플리케이션 설치 및 동적 서버 실행 (PM2 사용)
      - name: EC2에서 애플리케이션 설치 및 실행
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/client
            # production 모드로 의존성 설치 (이미 빌드된 .next 폴더 사용)
            npm install --production
            # 빌드 완료 후, Next.js 동적 서버 실행 (PM2를 사용해 실행 중이면 재시작)
            pm2 restart nextjs-app || pm2 start npm --name "nextjs-app" -- start
  


       










